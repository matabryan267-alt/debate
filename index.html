<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debate IA - Sistema Corregido</title>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .box { background: #1a1a1a; padding: 25px; border-radius: 15px; width: 100%; max-width: 450px; border-bottom: 4px solid #007bff; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        #btn-main { 
            background: #007bff; color: white; border: none; padding: 15px 30px; 
            font-size: 16px; border-radius: 50px; cursor: pointer; font-weight: bold; margin: 15px 0;
            transition: all 0.3s ease;
        }
        
        .active { background: #ff4444 !important; animation: pulse 1.5s infinite; }
        .processing { background: #ffaa00 !important; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0); } }
        
        #logs { 
            width: 100%; max-width: 450px; height: 300px; background: #000; 
            margin-top: 20px; padding: 15px; border-radius: 10px; overflow-y: auto; 
            font-family: 'Courier New', monospace; font-size: 13px; border: 1px solid #333;
            display: flex; flex-direction: column-reverse;
        }
        .status-msg { color: #00ff88; font-weight: bold; text-transform: uppercase; }
        .log-ia { color: #00d4ff; margin-bottom: 5px; }
        .log-user { color: #aaa; margin-bottom: 5px; }
        .log-system { color: #ffaa00; font-style: italic; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Control de Debate IA</h2>
        <p>Estado: <span id="st-txt" class="status-msg">DESCONECTADO</span></p>
        <button id="btn-main" onclick="toggleSistema()">INICIAR SISTEMA</button>
        <p style="font-size: 12px; color: #888;">Comandos: <b>"Vamos a ver"</b> para grabar | <b>"Bueno"</b> para enviar.</p>
    </div>

    <div id="logs"><div>> Esperando interacción...</div></div>

    <script>
        // Nota: En producción, las API Keys deben manejarse desde el Backend.
        const API_KEY = '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';
        const MODELO = "llama-3.1-8b-instant";

        let recognition;
        let isSystemOn = false;
        let modoDebateActivo = false;
        let bufferTexto = '';
        let isSpeaking = false;

        const btnMain = document.getElementById('btn-main');
        const statusTxt = document.getElementById('st-txt');

        function addLog(msg, type = "system") {
            const l = document.getElementById('logs');
            const color = type === "ia" ? "#00d4ff" : (type === "user" ? "#aaa" : "#ffaa00");
            l.insertAdjacentHTML('afterbegin', `<div style="color:${color}">> ${msg}</div>`);
        }

        function initSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Navegador no compatible. Usa Chrome.");
                return null;
            }
            const rec = new SpeechRecognition();
            rec.lang = 'es-ES';
            rec.continuous = true;
            rec.interimResults = false; // Cambiado a false para mayor precisión en comandos

            rec.onstart = () => {
                statusTxt.innerText = modoDebateActivo ? "GRABANDO DEBATE..." : "ESCUCHANDO...";
                addLog(modoDebateActivo ? "Micrófono grabando..." : "Esperando comando de inicio...");
            };

            rec.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
                
                // 1. Lógica de Activación
                if (!modoDebateActivo && transcript.includes("vamos a ver")) {
                    modoDebateActivo = true;
                    bufferTexto = '';
                    statusTxt.innerText = "GRABANDO DEBATE...";
                    btnMain.classList.add('active');
                    addLog("🔴 MODO DEBATE ACTIVADO", "system");
                    return;
                }

                // 2. Lógica de Envío
                if (modoDebateActivo && transcript.includes("bueno")) {
                    modoDebateActivo = false;
                    btnMain.classList.remove('active');
                    btnMain.classList.add('processing');
                    addLog("Enviando a IA...", "system");
                    enviarAIA(bufferTexto);
                    bufferTexto = '';
                    return;
                }

                // 3. Acumulación de texto
                if (modoDebateActivo) {
                    bufferTexto += transcript + ". ";
                    addLog("Escuchado: " + transcript, "user");
                }
            };

            rec.onerror = (e) => {
                if(e.error !== 'no-speech') addLog("Error: " + e.error, "system");
            };

            rec.onend = () => {
                // Reiniciar automáticamente solo si el sistema debe estar encendido y la IA no está hablando
                if (isSystemOn && !isSpeaking) {
                    recognition.start();
                }
            };

            return rec;
        }

        function toggleSistema() {
            if (!isSystemOn) {
                isSystemOn = true;
                btnMain.innerText = "DETENER SISTEMA";
                statusTxt.innerText = "CONECTANDO...";
                if (!recognition) recognition = initSpeech();
                recognition.start();
            } else {
                detenerTodo();
            }
        }

        function detenerTodo() {
            isSystemOn = false;
            modoDebateActivo = false;
            if (recognition) recognition.stop();
            window.speechSynthesis.cancel();
            btnMain.innerText = "INICIAR SISTEMA";
            btnMain.classList.remove('active', 'processing');
            statusTxt.innerText = "DESCONECTADO";
            addLog("Sistema apagado.");
        }

        async function enviarAIA(texto) {
            if (!texto.trim()) {
                addLog("No se detectó discurso. Reiniciando...", "system");
                finalizarProcesamiento();
                return;
            }

            try {
                const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: MODELO,
                        messages: [
                            { role: "system", content: "Eres un debatiente experto. Responde de forma muy breve (máximo 2 frases), sarcástica y directa en español." },
                            { role: "user", content: texto }
                        ]
                    })
                });

                const data = await r.json();
                const respuesta = data.choices[0].message.content;
                addLog("IA: " + respuesta, "ia");
                hablar(respuesta);
            } catch (e) {
                addLog("Error en API: " + e.message, "system");
                finalizarProcesamiento();
            }
        }

        function hablar(mensaje) {
            isSpeaking = true;
            recognition.stop(); // 🛑 Detenemos el micro para que no se escuche a sí misma
            
            const utterance = new SpeechSynthesisUtterance(mensaje);
            utterance.lang = 'es-ES';
            utterance.rate = 1.0;

            utterance.onend = () => {
                isSpeaking = false;
                finalizarProcesamiento();
            };

            window.speechSynthesis.speak(utterance);
        }

        function finalizarProcesamiento() {
            btnMain.classList.remove('processing');
            if (isSystemOn) {
                recognition.start(); // 🎤 Volvemos a escuchar tras terminar de hablar
            }
        }
    </script>
</body>
</html>
